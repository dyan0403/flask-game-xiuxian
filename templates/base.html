<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tu Tiên Ký - 修仙之路</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯</text></svg>">
</head>
<body>
<div id="app">
{% block content %}{% endblock %}
</div>

<script>
const panel = document.querySelector('.console-panel');
if (panel) {
  panel.scrollTop = panel.scrollHeight;
  const observer = new MutationObserver(() => { panel.scrollTop = panel.scrollHeight; });
  observer.observe(panel, { childList: true, subtree: true });
}
</script>
</body>
</html>
